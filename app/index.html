<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <h1>Project Pulse</h1>
      <p>Active projects, owners, status, and recent activity at a glance.</p>
    </header>

    <section class="summary" id="summary" aria-label="Project summary"></section>

    <p class="state-message" id="state-message" role="status">Loading projects…</p>

    <section class="project-grid" id="project-grid" aria-live="polite" aria-label="Projects"></section>
  </main>

  <script>
    (function () {
      var STATUSES = ["On Track", "At Risk", "Blocked", "Completed"];
      var PRIORITIES = ["High", "Medium", "Low"];

      var grid = document.getElementById("project-grid");
      var summary = document.getElementById("summary");
      var stateMessage = document.getElementById("state-message");

      function toSuffix(value) {
        return String(value).trim().toLowerCase().replace(/\s+/g, "-");
      }

      function textOrDash(value) {
        if (value === undefined || value === null || String(value).trim() === "") {
          return "—";
        }
        return String(value);
      }

      function showState(message, isError) {
        stateMessage.hidden = false;
        stateMessage.textContent = message;
        stateMessage.className = isError ? "state-message state-message--error" : "state-message";
        stateMessage.setAttribute("role", isError ? "alert" : "status");
      }

      function hideState() {
        stateMessage.hidden = true;
        stateMessage.textContent = "";
      }

      function createBadge(baseClass, prefix, value, knownValues) {
        var badge = document.createElement("span");
        var text = textOrDash(value);
        var known = knownValues.indexOf(text) !== -1;
        badge.className = baseClass + (known ? " " + prefix + toSuffix(text) : "");
        badge.textContent = text;
        return badge;
      }

      function addMeta(list, label, valueNode) {
        var wrapper = document.createElement("div");
        var dt = document.createElement("dt");
        var dd = document.createElement("dd");
        dt.textContent = label;
        dd.appendChild(valueNode);
        wrapper.appendChild(dt);
        wrapper.appendChild(dd);
        list.appendChild(wrapper);
      }

      function textNode(value) {
        return document.createTextNode(textOrDash(value));
      }

      function createCard(project) {
        var card = document.createElement("article");
        card.className = "project-card";

        var title = document.createElement("h2");
        title.className = "project-card__title";
        title.textContent = textOrDash(project.name);
        card.appendChild(title);

        if (project.summary) {
          var blurb = document.createElement("p");
          blurb.className = "project-card__summary";
          blurb.textContent = project.summary;
          card.appendChild(blurb);
        }

        var meta = document.createElement("dl");
        meta.className = "project-card__meta";
        addMeta(meta, "Owner", textNode(project.owner));
        addMeta(meta, "Status", createBadge("status-badge", "status--", project.status, STATUSES));
        addMeta(meta, "Recent activity", textNode(project.recentActivity));
        addMeta(meta, "Priority", createBadge("priority-badge", "priority--", project.priority, PRIORITIES));
        card.appendChild(meta);

        return card;
      }

      function renderSummary(projects) {
        summary.textContent = "";
        var items = [["Total", projects.length]];
        STATUSES.forEach(function (status) {
          var count = projects.filter(function (p) { return p.status === status; }).length;
          items.push([status, count]);
        });
        items.forEach(function (entry) {
          var item = document.createElement("div");
          item.className = "summary__item";
          var value = document.createElement("span");
          value.className = "summary__value";
          value.textContent = String(entry[1]);
          var label = document.createElement("span");
          label.className = "summary__label";
          label.textContent = entry[0];
          item.appendChild(value);
          item.appendChild(label);
          summary.appendChild(item);
        });
      }

      function render(data) {
        var projects = data && Array.isArray(data.projects) ? data.projects : null;
        if (!projects) {
          throw new Error("project-data.json has no projects array.");
        }
        grid.textContent = "";
        summary.textContent = "";
        if (projects.length === 0) {
          showState("No projects to show yet. Add projects to project-data.json.", false);
          return;
        }
        hideState();
        renderSummary(projects);
        projects.forEach(function (project) {
          grid.appendChild(createCard(project || {}));
        });
      }

      fetch("project-data.json")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Request failed with status " + response.status);
          }
          return response.json();
        })
        .then(render)
        .catch(function (error) {
          console.error(error);
          showState(
            "We couldn't load the project data. Please start the dashboard with the " +
            "\"Run Project Pulse Dashboard\" launch configuration in VS Code " +
            "(opening index.html directly from disk won't work).",
            true
          );
        });
    })();
  </script>
</body>
</html>
